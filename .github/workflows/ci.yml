name: CI

# 其它 workflow 都只在打 v* 标签时发布镜像，推送时没有任何检查；这里在推送和 PR 时跑类型检查、测试和构建。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # 和 Dockerfile 里的 oven/bun 保持一致
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
