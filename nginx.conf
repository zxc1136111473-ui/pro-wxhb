server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 目录补斜杠的跳转用相对地址：前面有反代时，带上容器内的 :3000 对外是不通的。
    absolute_redirect off;

    # 前端主包有 3.8MB，不压缩每个新访问者都要整份下载；gzip 后约 1.2MB。
    gzip on;
    # 前面有反代（Caddy 等）时请求会带 Via 头，nginx 默认不压缩这类「被代理的请求」，等于白开。
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端路由 /assets（我的资产）和构建产物目录 assets/ 同名：交给上面的 try_files 会被当成目录，
    # 不带斜杠 301 到 http://域名:3000/assets/，带斜杠 403，刷新页面就打不开。这里直接返回入口页。
    location = /assets {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /assets/ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Vite 产物的文件名带内容 hash，内容变了文件名就变，可以长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口页每次都要问一下有没有新版本，才能拿到新 hash 的包。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
