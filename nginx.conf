# 按请求路径决定缓存策略；值为空表示不加 Cache-Control 头。
# 写成 map 而不是在各个 location 里 add_header：nginx 里只要某个 location 自己写了 add_header，
# server 级的 add_header 就不会再被它继承，安全头会在这些 location 里丢掉。
map $uri $cache_control {
    default       "";
    # Vite 产物的文件名带内容 hash，内容变了文件名就变，可以长期缓存
    ~^/assets/.+  "public, max-age=31536000, immutable";
    # 入口页每次都要问一下有没有新版本，才能拿到新 hash 的包；/assets 是前端路由，返回的也是入口页
    /index.html   "no-cache";
    /assets       "no-cache";
    /assets/      "no-cache";
    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效
    /config.js    "no-store";
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 不在响应头里暴露 nginx 版本号。
    server_tokens off;

    # 目录补斜杠的跳转用相对地址：前面有反代时，带上容器内的 :3000 对外是不通的。
    absolute_redirect off;

    add_header Cache-Control $cache_control;
    # 基础安全头（always：错误页也带）。没有加 CSP：「调用脚本」功能要用 new Function 执行用户写的脚本，
    # 严格的 CSP 需要 unsafe-eval，起不到防护作用。HSTS 在前面的反代（Caddy）上配，容器内不知道自己是不是 https。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端主包有 3.8MB，不压缩每个新访问者都要整份下载；gzip 后约 1.2MB。
    gzip on;
    # 前面有反代（Caddy 等）时请求会带 Via 头，nginx 默认不压缩这类「被代理的请求」，等于白开。
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端路由 /assets（我的资产）和构建产物目录 assets/ 同名：交给上面的 try_files 会被当成目录，
    # 不带斜杠 301 到 http://域名:3000/assets/，带斜杠 403，刷新页面就打不开。这里直接返回入口页。
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    # 缺失的带 hash 文件要返回 404，不能回退成入口页（浏览器会当成 JS 解析然后报 MIME 错误）。
    location /assets/ {
    }
}
